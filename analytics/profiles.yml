
marketing:
  target: dev
  outputs:

    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: marketing_dev
      schema: "{{ env_var('DEV_SCHEMA', 'marketing_dev_kachi') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4

    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: marketing_ci
      schema: "{{ env_var('CI_SCHEMA', 'ci_default') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_SP_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_SP_SECRET') }}"
      threads: 4

    staging:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: marketing_staging
      schema: analytics
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_SP_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_SP_SECRET') }}"
      threads: 4

    production:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: marketing_prod
      schema: analytics
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_SP_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_SP_SECRET') }}"
      threads: 4